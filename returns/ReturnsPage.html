<style>
  .returns { max-width: 880px; margin: 0 auto; padding: 28px 16px 140px; }
  .returns .pallet-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
                         margin-bottom: 28px; }
  .returns .pallet-bar .text { font-size: 17px; color: var(--muted); }
  .returns .pallet-bar .text b { color: var(--text); font-weight: 600; }
  .returns .pallet-bar .acts { display: flex; gap: 8px; }
  .returns label.big { display: block; font-size: 16px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }

  .returns .search input { flex: 1 1 300px; min-width: 0; height: 68px; padding: 0 20px; font-size: 30px; font-weight: 600;

  /* Invoice cards */
  .returns .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px;
                   margin-top: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .returns .card:hover { border-color: #a8a29e; }
  .returns .card.sel { border-color: var(--text); box-shadow: 0 0 0 1px var(--text), 0 8px 24px rgba(24, 24, 27, .06); cursor: default; }
  .returns .card.off { opacity: .6; cursor: default; }
  .returns .card.off:hover { border-color: var(--line); }
  .returns .top { display: flex; align-items: flex-start; gap: 16px; }
  .returns .top .who { flex: 1; min-width: 0; font-size: 16px; color: var(--muted); }
  .returns .tick { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong);
                   display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
  .returns .card.sel .tick { background: var(--text); border-color: var(--text); color: #fff; }
  .returns .card.off .tick { visibility: hidden; }
  .returns .inv { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--text); }
  .returns .inv span { font-weight: 400; color: var(--muted); }
  .returns .inv.reading { font-size: 18px; font-weight: 400; color: var(--muted); }
  .returns .line { font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); word-break: break-word; }
  .returns .notes { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; margin-top: 6px; font-size: 16px; }
  .returns .tag { font-weight: 500; color: #52525b; }
  .returns .tag.bad, .returns .tag.warn { color: var(--warn); }
  .returns .tag.ok { color: var(--ok); }
  .returns .card a { color: var(--muted); }
  .returns .again { font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .returns .again:hover { color: var(--text); }

  /* Quantity and invoice number on the chosen card */
  .returns .chosen { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 18px; display: flex; flex-wrap: wrap;
                     gap: 20px 48px; align-items: flex-start; cursor: default; }
  .returns .chosen > div { display: flex; flex-direction: column; gap: 6px; }
  .returns .chosen .grow { flex: 1 1 260px; }
  .returns .chosen .again { align-self: flex-start; text-align: left; }
  .returns .fix label { display: block; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .returns .fix input { width: 100%; height: 56px; padding: 0 14px; font-size: 22px; font-weight: 600; text-transform: uppercase;
                        border: 1px solid var(--line-strong); border-radius: 12px; background: var(--card); }
  .returns .fix input:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .returns .hint { font-size: 15px; color: var(--muted); }
  .returns .stepper { display: flex; align-items: center; width: max-content; border: 1px solid var(--line-strong);
                      border-radius: 12px; overflow: hidden; background: var(--card); }
  .returns .stepper button { width: 56px; height: 56px; font-size: 28px; font-weight: 500; }
  .returns .stepper button:hover { background: var(--soft); }
  .returns .stepper button:disabled { color: #c4c4c8; background: var(--card); }
  .returns .stepper .n { min-width: 80px; text-align: center; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
                         line-height: 56px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

  /* Bottom bar */
  .returns .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, .97);
                  border-top: 1px solid var(--line); padding: 14px 16px; }
  .returns .bar .in { max-width: 848px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .returns .bar .text { flex: 1 1 260px; font-size: 17px; color: var(--muted); }
  .returns .bar .btn { height: 60px; padding: 0 56px; font-size: 22px; }

  /* Saved */
  .returns .done { max-width: 640px; margin: 0 auto; padding: 36px 0; text-align: center; display: flex;
                   flex-direction: column; align-items: center; gap: 8px; }
  .returns .done .saved { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; }
  .returns .done .saved span { width: 26px; height: 26px; border-radius: 50%; background: #dcfce7; display: inline-flex;
                               align-items: center; justify-content: center; font-size: 15px; }
  .returns .done p { margin: 24px 0 0; color: var(--muted); }
  .returns .done .big { font-size: 104px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05;
                        font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .returns .done .sub { color: var(--muted); font-size: 17px; }
  .returns .done .pallet { width: 100%; margin-top: 32px; padding: 18px 0; border-top: 1px solid var(--line);
                           border-bottom: 1px solid var(--line); display: flex; justify-content: space-between;
                           align-items: center; gap: 12px; }
  .returns .done .pallet span { color: var(--muted); }
  .returns .done .pallet b { font-size: 26px; }
  .returns .done .btn.primary { width: 100%; height: 64px; margin-top: 32px; font-size: 22px; }

  /* Pallets */
  .returns .back { min-height: 44px; font-size: 17px; font-weight: 500; color: var(--muted); }
  .returns .back:hover { color: var(--text); }
  .returns .ptitle { margin: 16px 0 4px; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .returns .psub { margin: 0 0 16px; color: var(--muted); font-size: 17px; }
  .returns .openmark { color: var(--ok); font-weight: 500; font-size: 16px; }
  .returns .pal { display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%;
                  margin-top: 12px; padding: 20px 22px; text-align: left; background: var(--card);
                  border: 1px solid var(--line); border-radius: 14px; }
  .returns .pal:hover { border-color: #a8a29e; }
  .returns .pal.open { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .returns .pal .name { display: block; font-size: 22px; font-weight: 700; }
  .returns .pal .dates { display: block; color: var(--muted); font-size: 16px; }
  .returns .pal .arrow { color: #a1a1aa; }
  .returns .plines { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 20px; }
  .returns .pline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 0; border-top: 1px solid #f0efed; }
  .returns .pline:first-child { border-top: 0; }
  .returns .pline .what { flex: 1 1 240px; min-width: 0; }
  .returns .pline .what b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .returns .pline .what em { font-style: normal; color: var(--muted); }
  .returns .pline .what span { display: block; color: var(--muted); font-size: 15px; }
  .returns .pick { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; font-size: 16px; color: var(--muted); }
</style>

<main id="returnsSection" class="returns" hidden>
  <section id="searchView">
    <div class="pallet-bar">
      <div class="text" id="palletText">Loading pallets…</div>
      <div class="acts">
        <button class="btn" id="newPallet" disabled>New pallet</button>
        <button class="btn" id="seePallets">See pallets</button>
      </div>
    </div>
    <form id="form">
      <label class="big" for="part">Part number</label>
      <div class="search">
        <input type="text" id="part" autocomplete="off" autofocus>
        <button class="btn primary" type="submit">Search</button>
      </div>
    </form>
    <div class="msg" id="msg">Type the part number and press Search.</div>
    <div id="results"></div>
  </section>

  <section id="doneView" class="done" hidden>
    <div class="saved" role="status"><span aria-hidden="true">✓</span>Saved</div>
    <p>Write this on the part</p>
    <div class="big" id="doneInvoice"></div>
    <div class="sub" id="doneSub"></div>
    <div class="pallet"><span id="donePut">Put it on</span><b id="donePallet"></b></div>
    <button class="btn primary" id="next">Next part</button>
    <button class="link" id="undo">Undo — that was a mistake</button>
  </section>

  <section id="palletsView" hidden>
    <button class="back" id="palletsBack">◀ Back to returns</button>
    <div id="palletsBody"></div>
  </section>

  <div class="bar" id="bar">
    <div class="in">
      <div class="text" id="barText"></div>
      <button class="btn primary" id="returnBtn" disabled>Return</button>
    </div>
  </div>
</main>


<script>
const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const MAX_QTY = 999;

// { part, search, loaded, items (not returned per Gmail key), returned, returnedInvoices, show,
//   details: {key: {invoice, found, line, shipped}}, sel, typed, qty, shipped: {key: typed number},
//   fixShipped, again: {key: true}, showReturned }
let state = null;
// From getPallets(), newest first: [{number, started, finished, open, qty}]
let pallets = [];
// The pallets screen: { show: pallet number or null for the list, lines, moving: id of the line being moved }
let pv = null;

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const part = $('part').value.trim();
  if (part) runSearch(part);
});

function showView(name) {
  $('searchView').hidden = name !== 'search';
  $('doneView').hidden = name !== 'done';
  $('palletsView').hidden = name !== 'pallets';
  $('bar').hidden = name !== 'search';
}

// `note` is shown above the results once they load (e.g. after an undo).
async function runSearch(part, note) {
  const search = Symbol();
  state = { part, search, loaded: false, items: [], returned: [], returnedInvoices: [], show: 15,
            details: {}, sel: null, qty: 1, shipped: {}, again: {}, showReturned: false };
  render();
  try {
    const res = await call('searchPart', part);
    if (state.search !== search) return;
    Object.assign(state, res, { loaded: true, note });
    render();
    readAll(search);
  } catch (err) {
    showMsg('Something went wrong: ' + err.message, true);
  }
}

// Read the PDFs a few at a time so results fill in as they are ready: the ones on screen first,
// then the already-returned ones (to see whether any of the part is left on them).
// If one turns out to be fully returned, the next invoice takes its place and is read too.
async function readAll(search) {
  const busy = {};
  const worker = async () => {
    for (;;) {
      if (state.search !== search) return;
      const item = available().concat(state.returned).find(i => !state.details[i.key] && !busy[i.key]);
      if (!item) return;
      busy[item.key] = true;
      let d;
      try { d = await call('readInvoice', item, state.part); }
      catch (err) { d = { invoice: '', found: false, line: '', shipped: null, error: true }; }
      if (state.search !== search) return;
      state.details[item.key] = d;
      render();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

// How many of the part were returned against this invoice before, and when: {when, qty} or null.
function returnInfo(item) {
  if (item.returnedOn) return { when: item.returnedOn, qty: item.returnedQty || 1 };
  const d = state.details[item.key];
  const hit = d && d.invoice && state.returnedInvoices.find(r => r.invoice === norm(d.invoice));
  return hit ? { when: hit.when, qty: hit.qty } : null;
}

// How many were shipped on the invoice (typed in, or read from the PDF), or null if not known.
function shippedOf(item) {
  if (state.shipped[item.key] !== undefined) return state.shipped[item.key];
  const d = state.details[item.key];
  return d && typeof d.shipped === 'number' ? d.shipped : null;
}

function leftOf(item) {
  const shipped = shippedOf(item);
  if (shipped === null) return null;
  const r = returnInfo(item);
  return shipped - (r ? r.qty : 0);
}

// Nothing left to return on this invoice (or it was returned and how many were shipped is unknown).
function used(item) {
  if (state.again[item.key] || state.sel === item.key) return false;
  if (!returnInfo(item)) return false;
  const left = leftOf(item);
  return left === null || left <= 0;
}

// Invoices the part can be returned against: ones with some of it left after an earlier return,
// then up to `show` of the newest not used yet.
function available() {
  const started = state.returned.concat(state.items).filter(i => !used(i) && (state.again[i.key] || returnInfo(i)));
  const fresh = state.items.filter(i => !state.again[i.key] && !returnInfo(i)).slice(0, state.show);
  return started.concat(fresh);
}

function alreadyReturned() {
  return state.returned.concat(state.items).filter(used);
}

function rank(item) {
  const d = state.details[item.key];
  if (!d) return 1;
  return d.found ? 0 : 2;
}

function card(item) {
  const d = state.details[item.key];
  const r = returnInfo(item);
  const off = used(item);
  const sel = state.sel === item.key;
  const shipped = shippedOf(item);
  const left = leftOf(item);
  const invoice = d ? d.invoice : item.returnedInvoice;
  let inv;
  if (invoice) inv = '<div class="inv"><span>Invoice</span> ' + esc(invoice) + '</div>';
  else if (!d) inv = '<div class="inv reading">Reading invoice…</div>';
  else inv = '<div class="inv reading">Invoice number not found — open the PDF to check</div>';
  let notes = '';
  if (r && off) {
    notes = '<span class="tag bad">Already returned' + (r.qty > 1 ? ' (' + r.qty + ')' : '') + ' on ' + esc(r.when) + '</span>'
      + '<button class="again" data-again="' + esc(item.key) + '">Return more from this invoice</button>'
      + '<button class="again" data-undo="' + esc(item.key) + '">Undo the last return</button>';
  } else if (r) {
    notes = '<span class="tag warn">' + r.qty + (shipped !== null ? ' of ' + shipped : '') + ' already returned, last on '
      + esc(r.when) + (left !== null ? ' — ' + Math.max(left, 0) + ' left' : '') + '</span>'
      + '<button class="again" data-undo="' + esc(item.key) + '">Undo the last return</button>';
  } else if (!sel && shipped !== null) {
    notes = '<span class="tag">' + shipped + ' shipped on this invoice</span>';
  }
  if (d && !d.found && !d.error) notes += '<span class="tag warn">Part number not seen in this PDF</span>';
  if (d && d.error) notes += '<span class="tag warn">Could not read this PDF</span>';
  notes += '<a href="https://mail.google.com/mail/u/0/#all/' + esc(item.threadId) + '" target="_blank">Open email</a>';
  return '<div class="card' + (sel ? ' sel' : '') + (off ? ' off' : '') + '" data-key="' + esc(item.key) + '"'
    + (off ? '' : ' tabindex="0" role="button" aria-pressed="' + sel + '"') + '>'
    + '<div class="top"><div class="who">' + esc(item.supplier) + ' · ' + esc(item.dateText) + inv
    + (d && d.line ? '<div class="line">' + esc(d.line) + '</div>' : '') + '</div>'
    + '<span class="tick" aria-hidden="true">' + (sel ? '✓' : '') + '</span></div>'
    + '<div class="notes">' + notes + '</div>'
    + (sel ? '<div class="chosen">' + howMany(item)
        + '<div class="fix grow"><label for="invoiceFix">Invoice number</label>'
        + '<input type="text" id="invoiceFix" value="' + esc(currentInvoice()) + '">'
        + '<span class="hint">Fix it if it does not match the PDF.</span></div></div>' : '')
    + '</div>';
}

// The quantity picker on the selected invoice.
function howMany(item) {
  const shipped = shippedOf(item);
  const left = leftOf(item);
  const r = returnInfo(item);
  const d = state.details[item.key];
  let info;
  if (state.fixShipped || (shipped === null && d)) {
    const typed = state.shipped[item.key] !== undefined ? state.shipped[item.key] : (d && typeof d.shipped === 'number' ? d.shipped : '');
    info = '<div class="fix"><label for="shippedFix">' + (state.fixShipped ? 'How many were shipped on this invoice?'
        : 'Could not read how many were shipped. Check the PDF and type it here:') + '</label>'
      + '<input type="text" inputmode="numeric" id="shippedFix" value="' + esc(typed) + '"></div>';
  } else if (shipped !== null) {
    info = '<span class="hint">' + shipped + ' shipped' + (r ? ', ' + r.qty + ' already returned' : ', none returned yet')
      + (left !== null && left > 0 ? ' — up to ' + left : '') + '</span>'
      + '<button class="again" data-fixshipped="1">Shipped number wrong? Change it</button>';
  } else {
    info = '<span class="hint">Reading how many were shipped…</span>';
  }
  return '<div><div class="fix"><label>How many are you returning?</label></div>'
    + '<div class="stepper"><button data-step="-1" aria-label="One fewer"' + (state.qty <= 1 ? ' disabled' : '') + '>−</button>'
    + '<span class="n" aria-live="polite">' + state.qty + '</span>'
    + '<button data-step="1" aria-label="One more"' + (state.qty >= maxQty() ? ' disabled' : '') + '>+</button></div>'
    + info
    + (left !== null && left <= 0 ? '<span class="tag bad">None left to return on this invoice</span>' : '')
    + '</div>';
}

// Most that can be returned from the selected invoice now.
function maxQty() {
  const item = selected();
  const left = item ? leftOf(item) : null;
  return left === null ? MAX_QTY : Math.min(left, MAX_QTY);
}

function selected() {
  return state && state.items.concat(state.returned).find(i => i.key === state.sel);
}

function render() {
  if (!state) return;
  if (!state.loaded) {
    showMsg('Searching your email for ' + state.part + '…');
    $('results').innerHTML = '';
    updateButton();
    return;
  }
  // Results re-render as PDFs finish reading; keep the cursor in the box being typed in.
  const active = document.activeElement;
  const keep = active && (active.id === 'invoiceFix' || active.id === 'shippedFix')
    ? { id: active.id, caret: active.selectionStart } : null;

  const list = available().sort((a, b) => rank(a) - rank(b) || b.dateIso.localeCompare(a.dateIso));
  const gone = alreadyReturned();
  if (!list.length && !gone.length) {
    showMsg('No invoices found with part ' + state.part + '. Check the part number and try again.', true);
  } else if (!list.length) {
    showMsg('This part has already been returned on every invoice found.', true);
  } else {
    showMsg('<b>' + list.length + (list.length === 1 ? ' invoice' : ' invoices') + '</b>'
      + ' where this part can still be returned. Tap one, then press Return.', false, true);
  }
  if (state.note) $('msg').innerHTML = esc(state.note) + ' ' + $('msg').innerHTML;
  $('results').innerHTML = list.map(card).join('')
    + (gone.length ? '<p class="msg"><button class="again" data-toggle="1">'
        + (state.showReturned ? 'Hide' : 'Show') + ' ' + gone.length + ' already returned</button></p>' : '')
    + (state.showReturned ? gone.map(card).join('') : '');

  if (keep && $(keep.id)) { $(keep.id).focus(); $(keep.id).setSelectionRange(keep.caret, keep.caret); }
  const fix = $('invoiceFix');
  if (fix) fix.addEventListener('input', () => { state.typed = fix.value; updateButton(); });
  const ship = $('shippedFix');
  if (ship) ship.addEventListener('input', () => {
    const n = parseInt(ship.value, 10);
    state.shipped[state.sel] = n >= 0 ? n : undefined;
    state.fixShipped = true;
    if (maxQty() >= 1) state.qty = Math.min(state.qty, maxQty());
    render();
  });
  updateButton();
}

function currentInvoice() {
  if (state.typed !== undefined) return state.typed;
  const d = state.details[state.sel];
  return d ? d.invoice : '';
}

function updateButton() {
  const item = selected();
  const invoice = state && state.sel ? currentInvoice().trim() : '';
  $('returnBtn').disabled = !(item && invoice && state.qty <= maxQty());
  const p = openPallet();
  $('barText').textContent = !state || !state.loaded ? ''
    : item ? state.qty + ' × ' + state.part.toUpperCase() + (invoice ? ' on invoice ' + invoice.toUpperCase() : '')
        + ' · pallet ' + (p ? p.number : nextPalletNumber())
    : 'Tap an invoice above to choose it.';
}

$('results').addEventListener('click', e => {
  if (e.target.closest('a') || e.target.closest('input')) return;
  const t = e.target.closest('button') || e.target;
  if (t.dataset.step) {
    state.qty = Math.max(1, Math.min(maxQty(), state.qty + Number(t.dataset.step)));
    render();
    return;
  }
  if (t.dataset.fixshipped) { state.fixShipped = true; render(); $('shippedFix').focus(); return; }
  if (t.dataset.toggle) { state.showReturned = !state.showReturned; render(); return; }
  const undo = t.dataset.undo;
  if (undo) {
    const item = state.items.concat(state.returned).find(i => i.key === undo);
    const d = state.details[undo];
    undoReturn(item, state.part, item.returnedInvoice || (d && d.invoice) || '');
    return;
  }
  const again = t.dataset.again;
  if (again) {
    state.again[again] = true;
    select(again);
    readAll(state.search);
    return;
  }
  // Clicks inside the quantity / invoice box don't change the chosen invoice.
  if (e.target.closest('.chosen')) return;
  const card = e.target.closest('.card');
  if (!card || card.classList.contains('off')) return;
  select(card.dataset.key);
});

$('results').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[tabindex]')) {
    e.preventDefault();
    select(e.target.dataset.key);
  }
});

function select(key) {
  if (state.sel !== key) { state.sel = key; state.typed = undefined; state.qty = 1; state.fixShipped = false; }
  render();
}

$('returnBtn').addEventListener('click', async () => {
  const item = selected();
  const invoice = currentInvoice().trim();
  if (!item || !invoice) return;
  $('returnBtn').disabled = true;
  $('returnBtn').textContent = 'Saving…';
  try {
    const res = await call('recordReturn', item, state.part, invoice, state.qty);
    state.last = { item, invoice: res.invoice };
    $('doneInvoice').textContent = res.invoice;
    $('doneSub').textContent = res.qty + ' × ' + state.part.toUpperCase() + ' · ' + item.supplier;
    $('donePut').textContent = 'Put ' + (res.qty > 1 ? 'them' : 'it') + ' on';
    $('donePallet').textContent = 'Pallet ' + res.pallet;
    showView('done');
    $('next').focus();
    loadPallets();
  } catch (err) {
    alert('Could not save: ' + err.message);
    updateButton();
  }
  $('returnBtn').textContent = 'Return';
});

$('next').addEventListener('click', () => {
  state = null;
  $('part').value = ''; $('results').innerHTML = '';
  showMsg('Type the part number and press Search.');
  showView('search');
  updateButton();
  $('part').focus();
});

$('undo').addEventListener('click', () => {
  if (state && state.last) undoReturn(state.last.item, state.part, state.last.invoice);
});

async function undoReturn(item, part, invoice) {
  if (!confirm('Undo this return?\n\nPart: ' + part.toUpperCase() + '\nInvoice: ' + invoice +
               '\n\nIf you already wrote the invoice number on the part, cross it out.')) return;
  try {
    await call('undoReturn', item, part, invoice);
  } catch (err) {
    alert('Could not undo: ' + err.message);
    return;
  }
  loadPallets();
  // Back to the invoice list for the same part, so the right one can be picked.
  showView('search');
  $('part').value = part;
  runSearch(part, '✓ Return undone.');
}

// `html`: the text has markup in it (already escaped).
function showMsg(text, err, html) {
  if (html) $('msg').innerHTML = text; else $('msg').textContent = text;
  $('msg').className = 'msg' + (err ? ' err' : '');
}

// ---------------------------------------------------------------------------
// Pallets

const partsText = n => n + (n === 1 ? ' part' : ' parts');
const openPallet = () => pallets.find(p => p.open);
const nextPalletNumber = () => Math.max(0, ...pallets.map(p => p.number)) + 1;

async function loadPallets() {
  try { setPallets(await call('getPallets')); }
  catch (err) { $('palletText').textContent = 'Could not load the pallets: ' + err.message; }
}

function setPallets(list) {
  pallets = list;
  const p = openPallet();
  $('palletText').innerHTML = p
    ? '<b>Pallet ' + p.number + '</b> · ' + (p.qty ? partsText(p.qty) : 'empty so far') + ' · started ' + esc(p.started)
    : 'No pallet started yet. The next return starts Pallet ' + nextPalletNumber() + '.';
  $('newPallet').disabled = !p || !p.qty;
  if (pv) renderPallets();
  updateButton();
}

$('newPallet').addEventListener('click', async () => {
  const p = openPallet();
  if (!p || !confirm('Is Pallet ' + p.number + ' finished?\n\nNew returns will go on Pallet ' + nextPalletNumber() + '.')) return;
  $('newPallet').disabled = true;
  try { setPallets(await call('newPallet')); }
  catch (err) { alert('Could not start a new pallet: ' + err.message); loadPallets(); }
});

$('seePallets').addEventListener('click', () => {
  pv = { show: null };
  showView('pallets');
  renderPallets();
  loadPallets();
});

$('palletsBack').addEventListener('click', () => {
  if (pv && pv.show) { pv = { show: null }; renderPallets(); return; }
  pv = null;
  showView('search');
  if (state && state.stale) runSearch(state.part);
});

function palletDates(p) {
  if (p.open) return 'Started ' + p.started;
  return p.started + (p.finished && p.finished !== p.started ? ' – ' + p.finished : '');
}

function renderPallets() {
  $('palletsBack').textContent = pv.show ? '◀ All pallets' : '◀ Back to returns';
  if (!pv.show) {
    $('palletsBody').innerHTML = '<h2 class="ptitle">Pallets</h2>'
      + (pallets.length ? '' : '<p class="psub">No pallets yet.</p>')
      + pallets.map(p => '<button class="pal' + (p.open ? ' open' : '') + '" data-pallet="' + p.number + '">'
        + '<span><span class="name">Pallet ' + p.number + '</span>'
        + '<span class="dates">' + esc(palletDates(p)) + ' · ' + partsText(p.qty) + '</span>'
        + (p.open ? '<span class="openmark">● New returns go on this pallet</span>' : '') + '</span>'
        + '<span class="arrow" aria-hidden="true">▶</span></button>').join('');
    return;
  }
  const p = pallets.find(x => x.number === pv.show);
  if (!p) { pv = { show: null }; renderPallets(); return; }
  const others = pallets.filter(x => x.number !== p.number).map(x => x.number).sort((a, b) => a - b);
  const line = l => '<div class="pline">'
    + '<div class="what"><b>' + esc(l.part) + '</b> <em>× ' + l.qty + '</em><span>Invoice ' + esc(l.invoice) + ' · ' + esc(l.when) + '</span></div>'
    + '<button class="btn" data-move="' + esc(l.id) + '">Move to pallet…</button>'
    + '<button class="btn danger" data-delete="' + esc(l.id) + '">Delete</button>'
    + (pv.moving === l.id ? '<div class="pick">' + (others.length
        ? 'Move to ' + others.map(n => '<button class="btn primary" data-to="' + n + '">Pallet ' + n + '</button>').join('')
        : 'There is no other pallet yet. Press New pallet first.')
      + '<button class="link" data-cancel="1">Cancel</button></div>' : '')
    + '</div>';
  $('palletsBody').innerHTML = '<h2 class="ptitle">Pallet ' + p.number + '</h2>'
    + '<p class="psub">' + esc(palletDates(p)) + ' · ' + partsText(p.qty) + '</p>'
    + (p.open ? '<span class="openmark">● New returns go on this pallet</span>'
        : '<button class="btn primary" data-reopen="' + p.number + '">Add more to this pallet</button>')
    + (!pv.lines ? '<p class="psub">Loading…</p>'
        : pv.lines.length ? '<div class="plines">' + pv.lines.map(line).join('') + '</div>' : '<p class="psub">Nothing on this pallet.</p>');
}

async function showPallet(number) {
  pv = { show: number, lines: null, moving: null };
  renderPallets();
  try {
    const lines = await call('getPallet', number);
    if (pv && pv.show === number) { pv.lines = lines; renderPallets(); }
  } catch (err) {
    alert('Could not load the pallet: ' + err.message);
  }
}

$('palletsBody').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.pallet) { showPallet(Number(b.dataset.pallet)); return; }
  if (b.dataset.move) { pv.moving = pv.moving === b.dataset.move ? null : b.dataset.move; renderPallets(); return; }
  if (b.dataset.cancel) { pv.moving = null; renderPallets(); return; }
  if (b.dataset.to) {
    b.disabled = true;
    try { setPallets(await call('moveToPallet', pv.moving, Number(b.dataset.to))); }
    catch (err) { alert('Could not move it: ' + err.message); }
    showPallet(pv.show);
    return;
  }
  if (b.dataset.delete) {
    const l = pv.lines.find(x => x.id === b.dataset.delete);
    if (!l || !confirm('Delete this return?\n\nPart: ' + l.part + ' × ' + l.qty + '\nInvoice: ' + l.invoice +
                       '\n\nIf you already wrote the invoice number on the part, cross it out.')) return;
    b.disabled = true;
    try { setPallets(await call('deleteReturn', l.id)); }
    catch (err) { alert('Could not delete: ' + err.message); }
    // The invoice list for this part may now be out of date; search again on the way back.
    if (state && state.loaded) state.stale = true;
    showPallet(pv.show);
    return;
  }
  if (b.dataset.reopen) {
    const n = Number(b.dataset.reopen);
    const open = openPallet();
    if (!confirm('Put new returns on Pallet ' + n + ' again?' + (open ? '\n\nPallet ' + open.number
        + (open.qty ? ' will be marked as finished.' : ' is empty and will be removed.') : ''))) return;
    try { setPallets(await call('reopenPallet', n)); }
    catch (err) { alert('Could not do that: ' + err.message); }
  }
});

loadPallets();
</script>
