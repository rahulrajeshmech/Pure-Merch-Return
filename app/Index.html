<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1b1d21; --muted: #5d6470; --line: #d5d9e0;
    --ok: #1d7a3a; --ok-bg: #e3f5e8; --bad: #b42318; --bad-bg: #fde8e6; --warn: #8a5a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 20px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .appbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; padding: 12px 16px;
            background: var(--text); color: #fff; }
  .appbar .brand { font-size: 28px; font-weight: 800; letter-spacing: .5px; }
  .appbar .sections { display: flex; gap: 8px; }
  .appbar .sections button { padding: 10px 20px; font-size: 20px; font-weight: 700; background: #3a3e46; color: #fff; }
  .appbar .sections button.on { background: #fff; color: var(--text); }
  .appbar .links { margin-left: auto; }
  .appbar .links a { font-size: 16px; color: #c9ced6; margin-left: 14px; }
  [hidden] { display: none !important; }
</style>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const call = (fn, ...args) => new Promise((ok, fail) =>
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));
</script>
</head>
<body data-section="<?= section ?>">
<header class="appbar">
  <div class="brand">PureTech</div>
  <nav class="sections">
    <button data-section="returns">Returns</button>
    <button data-section="scheduling">Scheduling</button>
  </nav>
  <nav class="links"><a id="sheetLink" target="_blank" href="#">Open spreadsheet</a><a id="excelLink" href="#">Download Excel</a></nav>
</header>

<?!= include_('ReturnsPage') ?>

<?!= include_('SchedulePage') ?>

<script>
  call('getConfig').then(c => { $('sheetLink').href = c.sheetUrl; $('excelLink').href = c.excelUrl; });

  function showSection(name) {
    $('returnsSection').hidden = name !== 'returns';
    $('schedulingSection').hidden = name !== 'scheduling';
    document.querySelectorAll('.appbar .sections button').forEach(b =>
      b.classList.toggle('on', b.dataset.section === name));
    if (name === 'scheduling') Scheduling.open();
    else $('part').focus();
  }
  document.querySelector('.appbar .sections').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) showSection(b.dataset.section);
  });
  showSection(document.body.dataset.section === 'scheduling' ? 'scheduling' : 'returns');
</script>
</body>
</html>
