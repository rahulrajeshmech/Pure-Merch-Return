<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts Return Log</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1d21; --muted: #5d6470; --line: #d5d9e0;
    --ok: #1d7a3a; --ok-bg: #e3f5e8; --bad: #b42318; --bad-bg: #fde8e6; --btn: #1d7a3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 20px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 30px; margin: 8px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 700; font-size: 22px; margin-bottom: 6px; }
  .step { display: inline-block; width: 34px; height: 34px; border-radius: 50%; background: var(--text); color: #fff;
          text-align: center; line-height: 34px; margin-right: 8px; font-size: 18px; }
  input[type=text] { width: 100%; font-size: 28px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px;
                     text-transform: uppercase; }
  input[type=text]:focus { outline: none; border-color: #2f6fed; }
  .used { margin-top: 10px; font-size: 18px; color: var(--muted); }
  .used b { color: var(--bad); }
  .status { margin-top: 14px; padding: 16px; border-radius: 10px; font-size: 24px; font-weight: 700; display: none; }
  .status.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  .status.bad { display: block; background: var(--bad-bg); color: var(--bad); }
  .status small { display: block; font-weight: 400; font-size: 18px; margin-top: 4px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 0; }
  .save { width: 100%; padding: 20px; font-size: 28px; font-weight: 700; background: var(--btn); color: #fff; margin-top: 16px; }
  .save:disabled { background: #a9b0bb; cursor: not-allowed; }
  .anyway { display: none; margin-top: 10px; background: none; color: var(--bad); text-decoration: underline; font-size: 17px; padding: 4px 0; }
  .done { display: none; text-align: center; font-size: 26px; font-weight: 700; color: var(--ok); padding: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 18px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .del { background: none; color: var(--muted); font-size: 16px; text-decoration: underline; padding: 0; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .tools button, .tools label { font-size: 16px; padding: 10px 14px; background: #e6e9ef; color: var(--text); font-weight: 400;
                                 margin: 0; border-radius: 8px; cursor: pointer; }
  details summary { cursor: pointer; font-size: 18px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>Parts Return Log</h1>

  <div class="card" id="form">
    <label for="part"><span class="step">1</span>Part number</label>
    <input type="text" id="part" autocomplete="off" autofocus>
    <div class="used" id="used"></div>

    <div style="height:20px"></div>

    <label for="invoice"><span class="step">2</span>Invoice number</label>
    <input type="text" id="invoice" autocomplete="off">
    <div class="status" id="status"></div>
    <button class="anyway" id="anyway">This invoice had more than one of this part — save anyway</button>

    <button class="save" id="save" disabled>SAVE RETURN</button>
    <div class="done" id="done">✔ Saved</div>
  </div>

  <div class="card">
    <details>
      <summary>Past returns (<span id="count">0</span>)</summary>
      <div style="height:10px"></div>
      <input type="text" id="filter" placeholder="Search..." style="font-size:18px;padding:8px 10px">
      <div style="height:10px"></div>
      <div id="list"></div>
      <div class="tools">
        <button id="backup">Save backup file</button>
        <label>Load backup file<input type="file" id="restore" accept=".json" hidden></label>
      </div>
    </details>
  </div>
</main>

<script>
const KEY = 'parts-return-log-v1';
const $ = id => document.getElementById(id);

// Same part / invoice typed with different spacing, dashes or case should still match.
const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function store(rows) {
  try { localStorage.setItem(KEY, JSON.stringify(rows)); return true; }
  catch { alert('Could not save. Please tell your supervisor.'); return false; }
}
let rows = load();

const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function matches(part, invoice) {
  return rows.filter(r => norm(r.part) === norm(part) && (invoice === undefined || norm(r.invoice) === norm(invoice)));
}

function refresh() {
  const part = $('part').value.trim(), invoice = $('invoice').value.trim();
  $('done').style.display = 'none';

  // Under step 1: which invoices are already used for this part.
  const usedFor = part ? [...new Set(matches(part).map(r => r.invoice))] : [];
  $('used').innerHTML = !part ? '' : usedFor.length
    ? 'Already returned on invoice: <b>' + usedFor.map(esc).join(', ') + '</b> — pick a different one.'
    : 'This part has never been returned. Any invoice is fine.';

  // Under step 2: is this exact part + invoice already used?
  const st = $('status');
  st.className = 'status';
  $('anyway').style.display = 'none';
  if (part && invoice) {
    const hit = matches(part, invoice);
    if (hit.length) {
      st.className = 'status bad';
      st.innerHTML = '✖ ALREADY RETURNED — use another invoice'
        + '<small>Returned on ' + fmtDate(hit[hit.length - 1].date) + (hit.length > 1 ? ' (' + hit.length + ' times)' : '') + '</small>';
      $('anyway').style.display = 'block';
    } else {
      st.className = 'status ok';
      st.textContent = '✔ OK — not returned yet';
    }
  }
  $('save').disabled = !(part && invoice) || st.classList.contains('bad');
  renderList();
}

function save() {
  const part = $('part').value.trim().toUpperCase(), invoice = $('invoice').value.trim().toUpperCase();
  if (!part || !invoice) return;
  rows.push({ part, invoice, date: new Date().toISOString() });
  if (!store(rows)) { rows.pop(); return; }
  $('part').value = ''; $('invoice').value = '';
  refresh();
  $('done').style.display = 'block';
  $('part').focus();
}

function renderList() {
  $('count').textContent = rows.length;
  const f = norm($('filter').value);
  const shown = rows.map((r, i) => ({ ...r, i }))
    .filter(r => !f || norm(r.part).includes(f) || norm(r.invoice).includes(f))
    .reverse();
  $('list').innerHTML = shown.length
    ? '<table><tr><th>Date</th><th>Part</th><th>Invoice</th><th></th></tr>' + shown.map(r =>
        `<tr><td>${fmtDate(r.date)}</td><td>${esc(r.part)}</td><td>${esc(r.invoice)}</td>`
        + `<td><button class="del" data-i="${r.i}">remove</button></td></tr>`).join('') + '</table>'
    : '<div class="empty">Nothing here yet.</div>';
}

$('list').addEventListener('click', e => {
  const i = e.target.dataset.i;
  if (i === undefined) return;
  const r = rows[i];
  if (!confirm('Remove this return?\n\nPart: ' + r.part + '\nInvoice: ' + r.invoice)) return;
  rows.splice(i, 1);
  store(rows);
  refresh();
});

$('part').addEventListener('input', refresh);
$('invoice').addEventListener('input', refresh);
$('filter').addEventListener('input', renderList);
$('save').addEventListener('click', save);
$('anyway').addEventListener('click', () => {
  if (confirm('Only do this if that invoice had MORE THAN ONE of this part.\n\nSave anyway?')) save();
});
// Enter moves from part to invoice, then saves.
$('part').addEventListener('keydown', e => { if (e.key === 'Enter') $('invoice').focus(); });
$('invoice').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('save').disabled) save(); });

$('backup').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(rows, null, 1)], { type: 'application/json' }));
  a.download = 'returns-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
});
$('restore').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data)) throw 0;
    // Merge, skipping entries already present.
    const seen = new Set(rows.map(r => r.part + '|' + r.invoice + '|' + r.date));
    const added = data.filter(r => r.part && r.invoice && r.date && !seen.has(r.part + '|' + r.invoice + '|' + r.date));
    rows = rows.concat(added).sort((a, b) => a.date.localeCompare(b.date));
    store(rows);
    refresh();
    alert('Loaded ' + added.length + ' returns from backup.');
  } catch { alert('That file is not a returns backup.'); }
  e.target.value = '';
});

refresh();
</script>
</body>
</html>
