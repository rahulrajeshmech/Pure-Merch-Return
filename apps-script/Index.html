<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1b1d21; --muted: #5d6470; --line: #d5d9e0;
    --ok: #1d7a3a; --ok-bg: #e3f5e8; --bad: #b42318; --bad-bg: #fde8e6; --warn: #8a5a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 20px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 140px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 30px; margin: 8px 0 16px; }
  header nav a { font-size: 16px; color: var(--muted); margin-left: 14px; }
  .search { display: flex; gap: 10px; }
  input[type=text] { width: 100%; font-size: 28px; padding: 12px 14px; border: 2px solid var(--line);
                     border-radius: 10px; text-transform: uppercase; }
  input[type=text]:focus { outline: none; border-color: #2f6fed; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .go { padding: 0 26px; font-size: 24px; font-weight: 700; background: var(--text); color: #fff; }
  .msg { margin: 18px 4px; font-size: 20px; color: var(--muted); }
  .msg.err { color: var(--bad); }
  .card { background: var(--card); border: 3px solid var(--line); border-radius: 12px; padding: 16px 18px;
          margin-top: 12px; cursor: pointer; }
  .card.sel { border-color: var(--ok); background: #f6fcf8; }
  .card.off { opacity: .55; cursor: default; }
  .top { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 17px; }
  .top b { color: var(--text); font-size: 20px; }
  .inv { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .inv.reading { color: var(--muted); font-weight: 400; font-size: 20px; }
  .line { font: 15px/1.3 ui-monospace, Consolas, monospace; color: var(--muted); margin-top: 6px; word-break: break-word; }
  .tag { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 6px; font-size: 16px; font-weight: 600; }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tag.warn { background: #fff4d6; color: var(--warn); }
  .card a { font-size: 16px; color: #2f6fed; }
  .again { background: none; color: var(--bad); text-decoration: underline; font-size: 15px; padding: 0; margin-left: 10px; }
  .fix { margin-top: 12px; }
  .fix label { font-size: 16px; color: var(--muted); display: block; margin-bottom: 4px; }
  .fix input { font-size: 24px; padding: 8px 12px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
         padding: 14px 16px; }
  .bar button { display: block; width: 100%; max-width: 728px; margin: 0 auto; padding: 20px; font-size: 30px;
                font-weight: 800; background: var(--ok); color: #fff; }
  .bar button:disabled { background: #a9b0bb; cursor: not-allowed; }
  .done { text-align: center; padding: 40px 10px; }
  .done p { font-size: 24px; margin: 0 0 10px; }
  .done .big { font-size: 64px; font-weight: 800; letter-spacing: 2px; margin: 10px 0 6px; word-break: break-all; }
  .done .sub { color: var(--muted); font-size: 18px; }
  .done button { margin-top: 30px; padding: 18px 40px; font-size: 26px; font-weight: 700; background: var(--text); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Parts Returns</h1>
    <nav><a id="sheetLink" target="_blank" href="#">Open spreadsheet</a><a id="excelLink" href="#">Download Excel</a></nav>
  </header>

  <section id="searchView">
    <form class="search" id="form">
      <input type="text" id="part" placeholder="Part number" autocomplete="off" autofocus>
      <button class="go" type="submit">Search</button>
    </form>
    <div class="msg" id="msg">Type the part number and press Search.</div>
    <div id="results"></div>
  </section>

  <section id="doneView" class="done" hidden>
    <p>✔ Saved. Write this on the part:</p>
    <div class="big" id="doneInvoice"></div>
    <div class="sub" id="doneSub"></div>
    <button id="next">NEXT PART</button>
  </section>
</main>

<div class="bar" id="bar"><button id="returnBtn" disabled>RETURN</button></div>

<script>
const $ = id => document.getElementById(id);
const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const call = (fn, ...args) => new Promise((ok, fail) =>
  google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));

let state = null;   // { part, items, returnedInvoices, details: {key: {...}}, sel, again: {key: true}, search }

call('getConfig').then(c => { $('sheetLink').href = c.sheetUrl; $('excelLink').href = c.excelUrl; });

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const part = $('part').value.trim();
  if (!part) return;
  const search = Symbol();
  state = { part, items: [], returnedInvoices: [], details: {}, sel: null, again: {}, search };
  showMsg('Searching your email for ' + part + '…');
  render();
  try {
    const res = await call('searchPart', part);
    if (state.search !== search) return;
    Object.assign(state, res);
    if (!res.items.length) {
      showMsg('No invoices found with part ' + part + '. Check the part number and try again.', true);
      return;
    }
    showMsg('Found ' + res.items.length + ' invoice' + (res.items.length > 1 ? 's' : '') +
            '. Tap one, then press RETURN.');
    render();
    readAll(search);
  } catch (err) {
    showMsg('Something went wrong: ' + err.message, true);
  }
});

// Read the PDFs a few at a time so results fill in as they are ready.
async function readAll(search) {
  const queue = state.items.slice();
  const worker = async () => {
    while (queue.length && state.search === search) {
      const item = queue.shift();
      try {
        const d = await call('readInvoice', item, state.part);
        if (state.search === search) state.details[item.key] = d;
      } catch (err) {
        if (state.search === search) state.details[item.key] = { invoice: '', found: false, line: '', error: true };
      }
      if (state.search === search) render();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
}

function returnedOn(item) {
  if (item.returnedOn) return item.returnedOn;
  const d = state.details[item.key];
  const hit = d && d.invoice && state.returnedInvoices.find(r => r.invoice === norm(d.invoice));
  return hit ? hit.when : '';
}

function rank(item) {
  const d = state.details[item.key];
  if (returnedOn(item) && !state.again[item.key]) return 3;
  if (!d) return 1;
  return d.found ? 0 : 2;
}

function render() {
  if (!state) return;
  // Results re-render as PDFs finish reading; keep the cursor in the invoice box.
  const active = document.activeElement;
  const hadFocus = active && active.id === 'invoiceFix';
  const caret = hadFocus ? active.selectionStart : 0;
  const items = state.items.slice().sort((a, b) => rank(a) - rank(b) || b.dateIso.localeCompare(a.dateIso));
  $('results').innerHTML = items.map(item => {
    const d = state.details[item.key];
    const done = returnedOn(item);
    const off = done && !state.again[item.key];
    const sel = state.sel === item.key;
    let inv;
    if (!d) inv = '<div class="inv reading">Reading invoice…</div>';
    else if (d.invoice) inv = '<div class="inv">Invoice ' + esc(d.invoice) + '</div>';
    else inv = '<div class="inv reading">Invoice number not found — open the PDF to check</div>';
    return '<div class="card' + (sel ? ' sel' : '') + (off ? ' off' : '') + '" data-key="' + esc(item.key) + '">'
      + '<div class="top"><b>' + esc(item.supplier) + '</b><span>' + esc(item.dateText) + '</span></div>'
      + inv
      + (d && d.line ? '<div class="line">' + esc(d.line) + '</div>' : '')
      + (done ? '<span class="tag bad">Already returned on ' + esc(done) + '</span>'
          + (off ? '<button class="again" data-again="' + esc(item.key) + '">had more than one? return again</button>' : '') : '')
      + (d && !d.found && !d.error ? '<span class="tag warn">Part number not seen in this PDF</span>' : '')
      + (d && d.error ? '<span class="tag warn">Could not read this PDF</span>' : '')
      + '<div><a href="https://mail.google.com/mail/u/0/#all/' + esc(item.threadId) + '" target="_blank">Open email</a></div>'
      + (sel ? '<div class="fix"><label>Invoice number (fix it if it does not match the PDF):</label>'
          + '<input type="text" id="invoiceFix" value="' + esc(currentInvoice()) + '"></div>' : '')
      + '</div>';
  }).join('');
  const fix = $('invoiceFix');
  if (fix && hadFocus) { fix.focus(); fix.setSelectionRange(caret, caret); }
  if (fix) fix.addEventListener('input', () => { state.typed = fix.value; updateButton(); });
  updateButton();
}

function currentInvoice() {
  if (state.typed !== undefined) return state.typed;
  const d = state.details[state.sel];
  return d ? d.invoice : '';
}

function updateButton() {
  $('returnBtn').disabled = !(state && state.sel && currentInvoice().trim());
}

$('results').addEventListener('click', e => {
  if (e.target.closest('a') || e.target.closest('input')) return;
  const again = e.target.dataset.again;
  if (again) {
    if (confirm('Only do this if that invoice had MORE THAN ONE of this part.\n\nReturn another one from it?')) {
      state.again[again] = true;
      select(again);
    }
    return;
  }
  const card = e.target.closest('.card');
  if (!card || card.classList.contains('off')) return;
  select(card.dataset.key);
});

function select(key) {
  if (state.sel !== key) { state.sel = key; state.typed = undefined; }
  render();
}

$('returnBtn').addEventListener('click', async () => {
  const item = state.items.find(i => i.key === state.sel);
  const invoice = currentInvoice().trim();
  if (!item || !invoice) return;
  $('returnBtn').disabled = true;
  $('returnBtn').textContent = 'Saving…';
  try {
    const res = await call('recordReturn', item, state.part, invoice);
    $('doneInvoice').textContent = res.invoice;
    $('doneSub').textContent = 'Part ' + state.part.toUpperCase() + ' · ' + item.supplier;
    $('searchView').hidden = true; $('bar').hidden = true; $('doneView').hidden = false;
  } catch (err) {
    alert('Could not save: ' + err.message);
    updateButton();
  }
  $('returnBtn').textContent = 'RETURN';
});

$('next').addEventListener('click', () => {
  state = null;
  $('part').value = ''; $('results').innerHTML = '';
  showMsg('Type the part number and press Search.');
  $('doneView').hidden = true; $('searchView').hidden = false; $('bar').hidden = false;
  updateButton();
  $('part').focus();
});

function showMsg(text, err) { $('msg').textContent = text; $('msg').className = 'msg' + (err ? ' err' : ''); }
</script>
</body>
</html>
